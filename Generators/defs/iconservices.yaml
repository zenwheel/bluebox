# Icon Services (Mac OS 8.5's Icons.h): IconRefs and 'icns' icon families,
# in IconServicesLib.  Mac OS 8.5 runs only on PowerPC, and so does Icon
# Services: there is no 68k form.

- typedef:
    name: IconRef
    type: Ptr

- typedef:
    name: IconFamilyHandle
    type: Handle

- typedef:
    name: IconServicesUsageFlags
    type: uint32_t

- function:
    name: GetIconRef
    return: OSErr
    args:
      - name: vRefNum
        type: SInt16
      - name: creator
        type: OSType
      - name: iconType
        type: OSType
      - name: theIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: GetIconRefFromFile
    return: OSErr
    args:
      - name: theFile
        type: const FSSpec*
      - name: theIconRef
        type: Ptr*
      - name: theLabel
        type: int16_t*
    cfm: IconServicesLib

- function:
    name: GetIconRefFromFolder
    return: OSErr
    args:
      - name: vRefNum
        type: SInt16
      - name: parentFolderID
        type: int32_t
      - name: folderID
        type: int32_t
      - name: attributes
        type: SInt8
      - name: accessPrivileges
        type: SInt8
      - name: theIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: RegisterIconRefFromIconFamily
    return: OSErr
    args:
      - name: creator
        type: OSType
      - name: iconType
        type: OSType
      - name: iconFamily
        type: IconFamilyHandle
      - name: theIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: RegisterIconRefFromResource
    return: OSErr
    args:
      - name: creator
        type: OSType
      - name: iconType
        type: OSType
      - name: resourceFile
        type: const FSSpec*
      - name: resourceID
        type: int16_t
      - name: theIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: RegisterIconRefFromIconFile
    return: OSErr
    args:
      - name: creator
        type: OSType
      - name: iconType
        type: OSType
      - name: iconFile
        type: const FSSpec*
      - name: theIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: ReadIconFile
    return: OSErr
    args:
      - name: iconFile
        type: const FSSpec*
      - name: iconFamily
        type: Handle*
    cfm: IconServicesLib

- function:
    name: WriteIconFile
    return: OSErr
    args:
      - name: iconFamily
        type: IconFamilyHandle
      - name: iconFile
        type: const FSSpec*
    cfm: IconServicesLib

- function:
    name: UnregisterIconRef
    return: OSErr
    args:
      - name: creator
        type: OSType
      - name: iconType
        type: OSType
    cfm: IconServicesLib

- function:
    name: UpdateIconRef
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: OverrideIconRefFromResource
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
      - name: resourceFile
        type: const FSSpec*
      - name: resourceID
        type: int16_t
    cfm: IconServicesLib

- function:
    name: OverrideIconRef
    return: OSErr
    args:
      - name: oldIconRef
        type: IconRef
      - name: newIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: RemoveIconRefOverride
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: CompositeIconRef
    return: OSErr
    args:
      - name: backgroundIconRef
        type: IconRef
      - name: foregroundIconRef
        type: IconRef
      - name: compositeIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: IsIconRefComposite
    return: OSErr
    args:
      - name: compositeIconRef
        type: IconRef
      - name: backgroundIconRef
        type: Ptr*
      - name: foregroundIconRef
        type: Ptr*
    cfm: IconServicesLib

- function:
    name: IsValidIconRef
    return: Boolean
    args:
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: AcquireIconRef
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: ReleaseIconRef
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: GetIconRefOwners
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
      - name: owners
        type: uint16_t*
    cfm: IconServicesLib

- function:
    name: PlotIconRef
    return: OSErr
    args:
      - name: theRect
        type: const Rect*
      - name: align
        type: IconAlignmentType
      - name: transform
        type: IconTransformType
      - name: theIconServicesUsageFlags
        type: IconServicesUsageFlags
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: PlotIconRefInContext
    return: OSStatus
    args:
      - name: inContext
        type: Ptr
      - name: inRect
        type: const Rect*
      - name: inAlign
        type: IconAlignmentType
      - name: inTransform
        type: IconTransformType
      - name: inLabelColor
        type: const RGBColor*
      - name: inFlags
        type: uint32_t
      - name: inIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: PtInIconRef
    return: Boolean
    args:
      - name: testPt
        type: const Point*
      - name: iconRect
        type: const Rect*
      - name: align
        type: IconAlignmentType
      - name: theIconServicesUsageFlags
        type: IconServicesUsageFlags
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: RectInIconRef
    return: Boolean
    args:
      - name: testRect
        type: const Rect*
      - name: iconRect
        type: const Rect*
      - name: align
        type: IconAlignmentType
      - name: iconServicesUsageFlags
        type: IconServicesUsageFlags
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: IconRefToRgn
    return: OSErr
    args:
      - name: theRgn
        type: RgnHandle
      - name: iconRect
        type: const Rect*
      - name: align
        type: IconAlignmentType
      - name: iconServicesUsageFlags
        type: IconServicesUsageFlags
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: GetIconSizesFromIconRef
    return: OSErr
    args:
      - name: iconSelectorInput
        type: IconSelectorValue
      - name: iconSelectorOutputPtr
        type: uint32_t*
      - name: iconServicesUsageFlags
        type: IconServicesUsageFlags
      - name: theIconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: IsIconRefMaskEmpty
    return: Boolean
    args:
      - name: iconRef
        type: IconRef
    cfm: IconServicesLib

- function:
    name: GetIconRefVariant
    return: IconRef
    args:
      - name: inIconRef
        type: IconRef
      - name: inVariant
        type: OSType
      - name: outTransform
        type: int16_t*
    cfm: IconServicesLib

- function:
    name: IconRefToIconFamily
    return: OSErr
    args:
      - name: theIconRef
        type: IconRef
      - name: whichIcons
        type: IconSelectorValue
      - name: iconFamily
        type: Handle*
    cfm: IconServicesLib

- function:
    name: IconFamilyToIconSuite
    return: OSErr
    args:
      - name: iconFamily
        type: IconFamilyHandle
      - name: whichIcons
        type: IconSelectorValue
      - name: iconSuite
        type: Handle*
    cfm: IconServicesLib

- function:
    name: IconSuiteToIconFamily
    return: OSErr
    args:
      - name: iconSuite
        type: Handle
      - name: whichIcons
        type: IconSelectorValue
      - name: iconFamily
        type: Handle*
    cfm: IconServicesLib

- function:
    name: SetIconFamilyData
    return: OSErr
    args:
      - name: iconFamily
        type: IconFamilyHandle
      - name: iconType
        type: OSType
      - name: h
        type: Handle
    cfm: IconServicesLib

- function:
    name: GetIconFamilyData
    return: OSErr
    args:
      - name: iconFamily
        type: IconFamilyHandle
      - name: iconType
        type: OSType
      - name: h
        type: Handle
    cfm: IconServicesLib

- function:
    name: FlushIconRefs
    return: OSErr
    args:
      - name: creator
        type: OSType
      - name: iconType
        type: OSType
    cfm: IconServicesLib

- function:
    name: FlushIconRefsByVolume
    return: OSErr
    args:
      - name: vRefNum
        type: SInt16
    cfm: IconServicesLib

- function:
    name: SetCustomIconsEnabled
    return: OSErr
    args:
      - name: vRefNum
        type: SInt16
      - name: enableCustomIcons
        type: Boolean
    cfm: IconServicesLib

- function:
    name: GetCustomIconsEnabled
    return: OSErr
    args:
      - name: vRefNum
        type: SInt16
      - name: customIconsEnabled
        type: Boolean*
    cfm: IconServicesLib

- function:
    name: IsDataAvailableInIconRef
    return: Boolean
    args:
      - name: inIconKind
        type: OSType
      - name: inIconRef
        type: IconRef
    cfm: IconServicesLib
