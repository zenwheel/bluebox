# ---- Variants of older traps

# _AllocContig is _Allocate with the HFS bit; _HTrashVolumeCaches is
# _FlushVol's.
- function:
    name: PBAllocContig
    return: OSErr
    args:
      - name: pb
        type: ParmBlkPtr
        register: A0
      - name: async
        type: Boolean
        register: TrapBit<0x400>
    trap: 0xA210
    returnreg: D0

- function:
    name: PBHTrashVolumeCaches
    return: OSErr
    args:
      - name: pb
        type: ParmBlkPtr
        register: A0
    trap: 0xA213
    returnreg: D0
    variants:
      - PBHTrashVolumeCachesSync

- function:
    name: AllocContig
    return: OSErr
    args:
      - name: refNum
        type: int16_t
      - name: count
        type: int32_t*
    cfm: InterfaceLib

- function:
    name: PBWaitIOComplete
    return: OSErr
    args:
      - name: paramBlock
        type: ParmBlkPtr
      - name: timeout
        type: int32_t
    cfm: InterfaceLib

# ---- The File System Manager ($A0AC): no foreign file systems but the
# ones a program installs.

- dispatcher:
    name: FSMDispatch
    trap: 0xA0AC
    selector-location: D0W

- function:
    name: InstallFS
    return: OSErr
    args:
      - name: fsdPtr
        type: void*
        register: A0
    dispatcher: FSMDispatch
    selector: 0x0000
    returnreg: D0

- function:
    name: RemoveFS
    return: OSErr
    args:
      - name: fsid
        type: int16_t
        register: A0
    dispatcher: FSMDispatch
    selector: 0x0001
    returnreg: D0

- function:
    name: GetFSInfo
    return: OSErr
