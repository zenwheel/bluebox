# Mac OS 9's File Manager additions (Files.h, Universal Interfaces 3.4):
# the HFS Plus calls on FSRefs, forks, iterators and Unicode names, and
# the Alias, Folder and Resource Manager calls on FSRefs.  Same schema as
# Defs/multiversal/defs.
#
# The parameter block calls reach 68k code through _HFSDispatch ($A260,
# the selector in D0), the fork reads and writes through $A2A8; the
# high-level calls through _HighLevelFSDispatch ($AA52), whose D0 holds
# the parameter size in words in its high byte and the selector in its
# low one.  A 64-bit value parameter of those is passed by address, as
# Pascal passes any value larger than four bytes; PowerPC passes it in
# two registers, so their PowerPC exports are written by hand (hfsplus.c).

- dispatcher:
    name: HighLevelFSDispatch
    trap: 0xAA52
    selector-location: D0<0xFF>

- dispatcher:
    name: ResourceDispatch
    trap: 0xA822
    selector-location: D0<0xFF>

# Unnamed in Traps.h: the fork reads and writes of Mac OS 9.
- dispatcher:
    name: FSForkIODispatch
    trap: 0xA0A8
    selector-location: D0W

