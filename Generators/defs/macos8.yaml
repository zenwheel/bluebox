    args:
      - name: theControl
        type: ControlHandle
      - name: newValue
        type: int32_t
    cfm: ControlsLib

- function:
    name: GetControl32BitValue
    return: int32_t
    args:
      - name: theControl
        type: ControlHandle
    cfm: ControlsLib

- function:
    name: SetControl32BitMinimum
    args:
      - name: theControl
        type: ControlHandle
      - name: newMinimum
        type: int32_t
    cfm: ControlsLib

- function:
    name: GetControl32BitMinimum
    return: int32_t
    args:
      - name: theControl
        type: ControlHandle
    cfm: ControlsLib

- function:
    name: SetControl32BitMaximum
    args:
      - name: theControl
        type: ControlHandle
      - name: newMaximum
        type: int32_t
    cfm: ControlsLib

- function:
    name: GetControl32BitMaximum
    return: int32_t
    args:
      - name: theControl
        type: ControlHandle
    cfm: ControlsLib

- function:
    name: SetControlViewSize
    args:
      - name: theControl
        type: ControlHandle
      - name: newViewSize
        type: int32_t
    cfm: ControlsLib

- function:
    name: GetControlViewSize
    return: int32_t
    args:
      - name: theControl
        type: ControlHandle
    cfm: ControlsLib

- function:
    name: IsValidControlHandle
    return: Boolean
    args:
      - name: theControl
        type: ControlHandle
    cfm: ControlsLib

# Appearance 1.1 (ControlsLib 8.5); no trap.
- function:
    name: GetControlRegion
    return: OSStatus
    args:
      - name: inControl
        type: ControlHandle
      - name: inPart
        type: int16_t
      - name: outRegion
        type: RgnHandle
    cfm: ControlsLib
