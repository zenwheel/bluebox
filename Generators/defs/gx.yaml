    return: Ptr
    args:
      - name: c
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x1E

- function:
    name: SetCollectionExceptionProc
    args:
      - name: c
        type: Ptr
      - name: exceptionProc
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x1F

- function:
    name: GetNewCollection
    return: Ptr
    args:
      - name: collectionID
        type: short
    dispatcher: CollectionDispatch
    selector: 0x20

- function:
    name: AddCollectionItemHdl
    return: OSErr
    args:
      - name: aCollection
        type: Ptr
      - name: tag
        type: long
      - name: id
        type: long
      - name: itemData
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x21

- function:
    name: GetCollectionItemHdl
    return: OSErr
    args:
      - name: aCollection
        type: Ptr
      - name: tag
        type: long
      - name: id
        type: long
      - name: itemData
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x22

- function:
    name: ReplaceIndexedCollectionItemHdl
    return: OSErr
    args:
      - name: aCollection
        type: Ptr
      - name: index
        type: long
      - name: itemData
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x23

- function:
    name: GetIndexedCollectionItemHdl
    return: OSErr
    args:
      - name: aCollection
        type: Ptr
      - name: index
        type: long
      - name: itemData
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x24

- function:
    name: FlattenCollectionToHdl
    return: OSErr
    args:
      - name: aCollection
        type: Ptr
      - name: flattened
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x25

- function:
    name: UnflattenCollectionFromHdl
    return: OSErr
    args:
      - name: aCollection
        type: Ptr
      - name: flattened
        type: Ptr
    dispatcher: CollectionDispatch
    selector: 0x26
