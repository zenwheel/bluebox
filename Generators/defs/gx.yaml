# QuickDraw GX (graphics: C calls through $A832, the selector in D0;
# printing: Pascal calls through $ABFE, a long selector in D0) and the
# Collection Manager ($ABF6, moveq selector).  Signatures from Apple's
# GXGraphics.h, GXEnvironment.h, GXPrinting.h and Collections.h (Universal
# Interfaces 3.x), the GX object types taken as longs.

- dispatcher:
    name: GXGraphicsDispatch
    trap: 0xA832
    selector-location: D0W
    convention: C

- dispatcher:
    name: GXPrintingDispatch
    trap: 0xABFE
    selector-location: D0L

- dispatcher:
    name: CollectionDispatch
    trap: 0xABF6
    selector-location: D0W

- function:
    name: GXNewGraphicsClient
    return: long
