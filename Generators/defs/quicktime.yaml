# QuickTime's Movie Toolbox (trap AAAA) and Image Compression Manager
# (trap AAA3): every selector, with its arguments reduced to their sizes on
# the stack, taken from the QuickTime interfaces.  Calls we do not implement
# return zero, as for a movie with nothing in it (see quicktime.c).

- dispatcher:
    name: ImageCompressionDispatch
    trap: 0xAAA3
    selector-location: D0W

- function:
    name: CheckQuickTimeRegistration
    args:
