# The Appearance Manager (Appearance.h, Universal Interfaces 3.2), Control
# Manager 2.0 (Controls.h), and the Mac OS 8 Dialog and Menu Manager
# additions.  The 68k calls go through _AppearanceDispatch ($AA74),
# _ControlDispatch ($AA73), _DialogDispatch ($AA68) and _MenuDispatch
# ($A825) with the selector in D0; the Appearance 1.1 calls had no trap
# (AppearanceLib exports only).

- dispatcher:
    name: AppearanceDispatch
    trap: 0xAA74
    selector-location: D0W

- dispatcher:
    name: ControlDispatch
    trap: 0xAA73
    selector-location: D0W

- dispatcher:
    name: MenuDispatch
    trap: 0xA825
    selector-location: D0W

