# Definitions missing from multiversal (or present there only as
# Executor-specific snippets).  Same schema as Defs/multiversal/defs.

# GetFrontProcess's glue pushes a dummy -1 long after the PSN pointer.
- function:
    name: GetFrontProcess
    return: OSErr
    args:
      - name: serial_number
        type: ProcessSerialNumber*
      - name: dummy
        type: int32_t
    dispatcher: OSDispatch
    selector: 0x0039

# ResourceDispatch's private override calls (ResourcesPriv.h); ResEdit
# turns scanning of override maps on and off around its own searches.
- function:
    name: SetScanOverride
    args:
      - name: scanOverride
        type: Boolean
    dispatcher: ResourceDispatch
    selector: 0x0007

- function:
    name: GetScanOverride
    return: Boolean
    dispatcher: ResourceDispatch
    selector: 0x0008

- function:
    name: PBHOpenRFDeny
    return: OSErr
    args:
      - name: pb
        type: HParmBlkPtr
        register: A0
      - name: a
        type: Boolean
        register: TrapBit<0x400>
    file_trap: true
    trap: 0xA260
    dispatcher: FSDispatch
    selector: 0x39
    returnreg: D0

