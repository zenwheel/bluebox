# A fourth private Apple Event Manager handler-table call beside install
# ($0831), lookup ($0833) and delete ($0632), with install's arguments.
# The ObjectSupportLib linked into applications (SpookHouse) stores its
# table entries with it; its real name is not known.
- function:
    name: _AE_hdlr_insert
    return: OSErr
    args:
      - type: AE_hdlr_table_h
      - type: int32_t
      - type: AE_hdlr_selector_t*
      - type: AE_hdlr_t*
    dispatcher: Pack8
    selector: 0x0830

# The Object Support Library's calls that 68k programs link in (the
# ObjectSupportLib.o library) and PowerPC programs import from
# ObjectSupportLib.
- function:
    name: AEObjectInit
    return: OSErr
    cfm: ObjectSupportLib

- function:
    name: CreateObjSpecifier
    return: OSErr
    args:
