    selector: 0x0410

# The Deferred Task Manager: a task (qLink, qType dtQType, dtFlags, dtAddr,
# dtParam) runs once, at the end of interrupt processing, with A1 = dtParam.
- function:
    name: DTInstall
    return: OSErr
    args:
      - name: dtTaskPtr
        type: Ptr
        register: A0
    trap: 0xA082
    returnreg: D0

# LowercaseText and its siblings push their sub-selector last, after the
# text, length and script (multiversal lists it first).
- function:
    name: TextUtilFunctions
    args:
      - name: textp
        type: Ptr
      - name: len
        type: INTEGER
      - name: script
        type: ScriptCode
      - name: selector
        type: int16_t
    dispatcher: ScriptUtil
    selector: 0x800AFFB6

# TextEdit 7.5's selection region (TextEdit.h; Gestalt 'teat' bit 0).
- function:
    name: TEGetHiliteRgn
    return: OSErr
    args:
      - name: region
        type: RgnHandle
      - name: hTE
        type: TEHandle
    dispatcher: TEDispatch
    selector: 0x000F

# A private QuickTime 2.5 call MoviePlayer 2.5 makes at startup (selector
# 0x273, not in Apple's interfaces): one pointer (it gets an atom container,
# apparently QuickTime's preferences), an OSErr.
- function:
    name: QTPrivateCall273
    return: OSErr
    args:
      - name: data
        type: Ptr
    dispatcher: QuickTime
    selector: 0x0273

# Its partner (0x274): the atom container 0x273 gave and a flag, an OSErr.
- function:
    name: QTPrivateCall274
    return: OSErr
    args:
      - name: container
        type: long
      - name: flag
        type: Boolean
    dispatcher: QuickTime
    selector: 0x0274

