# Definitions missing from multiversal (or present there only as
# Executor-specific snippets).  Same schema as Defs/multiversal/defs.

# GetFrontProcess's glue pushes a dummy -1 long after the PSN pointer.
- function:
    name: GetFrontProcess
    return: OSErr
    args:
      - name: serial_number
        type: ProcessSerialNumber*
      - name: dummy
        type: int32_t
    dispatcher: OSDispatch
    selector: 0x0039

# MultiFinder's first OSDispatch calls, which the Process Manager kept
# (OSDispatch selectors 1 to 3): Microsoft Word 5.0 asks GetSwitchInfo for
# the system's signature and version, and GetActiveTaskInfo lists the
# applications open.
- function:
    name: GetActiveTaskInfo
    return: INTEGER
    args:
      - name: taskInfo
        type: Ptr
      - name: numSlots
        type: INTEGER
    dispatcher: OSDispatch
    selector: 0x0001

- function:
    name: GetSwitchInfo
    args:
      - name: switchInfo
        type: Ptr
    dispatcher: OSDispatch
    selector: 0x0002

- function:
    name: CancelSwitch
    dispatcher: OSDispatch
    selector: 0x0003

# OSDispatch selectors $40 and $41, which Microsoft's Internet Library
# (Internet Explorer 5) calls around its allocations in the system heap:
# by their use, the Process Manager's BeginSystemMode and EndSystemMode.
# There is nothing to switch here.
- function:
    name: BeginSystemMode
    return: OSErr
    dispatcher: OSDispatch
    selector: 0x0040

- function:
    name: EndSystemMode
    return: OSErr
    dispatcher: OSDispatch
    selector: 0x0041

# The PPC Toolbox's trap: the routine selector in D0, the parameter
# block in A0, the result in D0.
- function:
    name: PPCDispatch
    args:
      - name: d0
        type: LONGINT
        register: D0
      - name: a0
        type: LONGINT
        register: A0
    trap: 0xA0DD

# ResourceDispatch's private override calls (ResourcesPriv.h); ResEdit
# turns scanning of override maps on and off around its own searches.
- function:
    name: SetScanOverride
    args:
      - name: scanOverride
        type: Boolean
    dispatcher: ResourceDispatch
    selector: 0x0007

- function:
    name: GetScanOverride
    return: Boolean
    dispatcher: ResourceDispatch
    selector: 0x0008

- function:
    name: PBHOpenRFDeny
    return: OSErr
    args:
      - name: pb
        type: HParmBlkPtr
        register: A0
      - name: a
        type: Boolean
        register: TrapBit<0x400>
    file_trap: true
    trap: 0xA260
    dispatcher: FSDispatch
    selector: 0x39
    returnreg: D0

# MIDI Manager: SoundDispatch tool 4, (routine << 16) | 4 in D0.
# MIDISignIn (FinaleUnknown2), MIDIAddPort (DirectorUnknown4) and the
# version call (DirectorUnknown3) are in multiversal under other names;
# InterfaceLib exports them under their own (MIDIVersion, a NumVersion,
# is in ppc_libs.c).

