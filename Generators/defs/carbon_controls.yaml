# CarbonLib's Control Manager and Dialog Manager additions (Controls.h,
# ControlDefinitions.h and Dialogs.h, Universal Interfaces 3.4): the
# accessors, ControlIDs, properties, custom definitions, the Create...Control
# calls and the Data Browser.  CarbonLib exports only: none of these had a
# 68k trap.  Same schema as Defs/multiversal/defs.

# Controls.h: accessors
- function:
    name: GetControlBounds
    return: Rect*
    args:
      - name: control
        type: ControlHandle
      - name: bounds
        type: Rect*

- function:
    name: SetControlBounds
    args:
      - name: control
        type: ControlHandle
      - name: bounds
        type: const Rect*

- function:
    name: IsControlHilited
    return: Boolean
    args:
      - name: control
        type: ControlHandle

- function:
    name: GetControlHilite
    return: UInt16
    args:
      - name: control
        type: ControlHandle

- function:
    name: GetControlOwner
    return: WindowPtr
    args:
      - name: control
        type: ControlHandle

- function:
    name: GetControlDataHandle
    return: Handle
    args:
      - name: control
        type: ControlHandle

- function:
    name: SetControlDataHandle
    args:
      - name: control
        type: ControlHandle
      - name: dataHandle
        type: Handle

- function:
    name: GetControlPopupMenuHandle
    return: MenuHandle
    args:
      - name: control
        type: ControlHandle

- function:
    name: GetControlPopupMenuID
    return: SInt16
    args:
      - name: control
        type: ControlHandle

- function:
    name: SetControlPopupMenuHandle
    args:
      - name: control
        type: ControlHandle
      - name: popupMenu
        type: MenuHandle

- function:
    name: SetControlPopupMenuID
    args:
      - name: control
        type: ControlHandle
      - name: menuID
        type: SInt16


