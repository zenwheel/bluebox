    dispatcher: ExpansionMgrDispatch
    selector: 0x0524

- function:
    name: ExpMgrConfigWriteLong
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: value
        type: uint32_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0625

- function:
    name: ExpMgrIOWriteByte
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: value
        type: uint8_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0529

- function:
    name: ExpMgrIOWriteWord
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: value
        type: uint16_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x052A

- function:
    name: ExpMgrIOWriteLong
    return: OSErr
    args:
      - name: node
