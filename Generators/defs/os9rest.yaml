# Mac OS 9's remaining library routines that have a 68k trap or a dispatch
# selector (os9rest*.c), for the 68k programs that call them and the
# PowerPC libraries that export them.  Same schema as ilutil.yaml.

# DebugLib (Debugging.h): _DebugLibDispatch ($AA7E), the selector in D0
# (MOVEQ #n,D0), Pascal arguments.
- dispatcher:
    name: DebugLibDispatch
    trap: 0xAA7E
    selector-location: D0W

- function:
    name: DebugAssert
    args:
      - name: componentSignature
        type: OSType
      - name: options
        type: uint32_t
      - name: assertionString
        type: const char*
      - name: exceptionString
        type: const char*
      - name: errorString
        type: const char*
      - name: fileName
        type: const char*
      - name: lineNumber
        type: int32_t
      - name: value
        type: void*
    dispatcher: DebugLibDispatch
    selector: 0x0000

- function:
    name: TaskLevel
    return: uint32_t
    dispatcher: DebugLibDispatch
    selector: 0x0001

- function:
    name: NewDebugComponent
    return: OSStatus
    args:
      - name: componentSignature
        type: OSType
      - name: componentName
        type: ConstStr255Param
      - name: componentCallback
        type: ProcPtr
    dispatcher: DebugLibDispatch
    selector: 0x0002

- function:
    name: NewDebugOption
    return: OSStatus
    args:
      - name: componentSignature
        type: OSType
      - name: optionSelectorNum
        type: int32_t
      - name: optionName
        type: ConstStr255Param
    dispatcher: DebugLibDispatch
    selector: 0x0003

- function:
    name: DisposeDebugComponent
    return: OSStatus
    args:
      - name: componentSignature
        type: OSType
    dispatcher: DebugLibDispatch
    selector: 0x0004

- function:
    name: GetDebugComponentInfo
    return: OSStatus
    args:
      - name: index
        type: uint32_t
      - name: componentSignature
        type: uint32_t*
      - name: componentName
        type: StringPtr
    dispatcher: DebugLibDispatch
    selector: 0x0005

- function:
    name: GetDebugOptionInfo
    return: OSStatus
    args:
      - name: index
        type: uint32_t
      - name: componentSignature
        type: OSType
      - name: optionSelectorNum
        type: int32_t*
      - name: optionName
        type: StringPtr
      - name: optionSetting
        type: Boolean*
    dispatcher: DebugLibDispatch
    selector: 0x0006

- function:
    name: SetDebugOptionValue
    return: OSStatus
    args:
      - name: componentSignature
        type: OSType
      - name: optionSelectorNum
        type: int32_t
      - name: newOptionSetting
        type: Boolean
    dispatcher: DebugLibDispatch
    selector: 0x0007

- function:
    name: InstallDebugAssertOutputHandler
    args:
      - name: handler
        type: ProcPtr
    dispatcher: DebugLibDispatch
    selector: 0x0008

# The Expansion Manager (PCI.h): _ExpansionMgr ($AAF3), the selector in D0
# with the arguments' size in words in its high byte, Pascal arguments.
- dispatcher:
    name: ExpansionMgrDispatch
    trap: 0xAAF3
    selector-location: D0W

- function:
    name: ExpMgrConfigReadByte
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: valuePtr
        type: uint8_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0620

- function:
    name: ExpMgrConfigReadWord
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: valuePtr
        type: uint16_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0621

- function:
    name: ExpMgrConfigReadLong
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: valuePtr
        type: uint32_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0622

- function:
    name: ExpMgrIOReadByte
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: valuePtr
        type: uint8_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0626

- function:
    name: ExpMgrIOReadWord
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: valuePtr
        type: uint16_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0627

- function:
    name: ExpMgrIOReadLong
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: valuePtr
        type: uint32_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0628

- function:
    name: ExpMgrConfigWriteByte
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: value
        type: uint8_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0523

- function:
    name: ExpMgrConfigWriteWord
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: value
        type: uint16_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0524

- function:
    name: ExpMgrConfigWriteLong
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: configAddr
        type: LogicalAddress
      - name: value
        type: uint32_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0625

- function:
    name: ExpMgrIOWriteByte
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: value
        type: uint8_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0529

- function:
    name: ExpMgrIOWriteWord
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: value
        type: uint16_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x052A

- function:
    name: ExpMgrIOWriteLong
    return: OSErr
    args:
      - name: node
        type: RegEntryIDPtr
      - name: ioAddr
        type: LogicalAddress
      - name: value
        type: uint32_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x062B

- function:
    name: ExpMgrInterruptAcknowledgeReadByte
    return: OSErr
    args:
      - name: entry
        type: RegEntryIDPtr
      - name: valuePtr
        type: uint8_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0411

- function:
    name: ExpMgrInterruptAcknowledgeReadWord
    return: OSErr
    args:
      - name: entry
        type: RegEntryIDPtr
      - name: valuePtr
        type: uint16_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0412

- function:
    name: ExpMgrInterruptAcknowledgeReadLong
    return: OSErr
    args:
      - name: entry
        type: RegEntryIDPtr
      - name: valuePtr
        type: uint32_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0413

- function:
    name: ExpMgrSpecialCycleWriteLong
    return: OSErr
    args:
      - name: entry
        type: RegEntryIDPtr
      - name: value
        type: uint32_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x0419

- function:
    name: ExpMgrSpecialCycleBroadcastLong
    return: OSErr
    args:
      - name: value
        type: uint32_t
    dispatcher: ExpansionMgrDispatch
    selector: 0x021A

# The rest of the Control Strip's module services (ControlStrip.h), same
# dispatcher: _ControlStripDispatch's selector in D0's low byte, the size of
# the arguments in words above it.
- function:
    name: SBGetDetachIconSuite
    return: OSErr
    args:
      - name: theIconSuite
        type: Handle*
      - name: theResID
        type: INTEGER
      - name: selector
        type: uint32_t
    dispatcher: ControlStripDispatch
    selector: 0x0507

- function:
    name: SBTrackPopupMenu
    return: INTEGER
    args:
      - name: moduleRect
        type: Rect*
      - name: theMenu
        type: MenuHandle
    dispatcher: ControlStripDispatch
    selector: 0x0408

- function:
    name: SBTrackSlider
    return: INTEGER
    args:
      - name: moduleRect
        type: Rect*
      - name: ticksOnSlider
        type: INTEGER
      - name: initialValue
        type: INTEGER
    dispatcher: ControlStripDispatch
    selector: 0x0409

- function:
    name: SBShowHelpString
    return: OSErr
    args:
      - name: moduleRect
        type: Rect*
      - name: helpString
        type: StringPtr
    dispatcher: ControlStripDispatch
    selector: 0x040A

- function:
    name: SBGetBarGraphWidth
    return: INTEGER
    args:
      - name: barCount
        type: INTEGER
    dispatcher: ControlStripDispatch
    selector: 0x010B

- function:
    name: SBDrawBarGraph
    args:
      - name: level
        type: INTEGER
      - name: barCount
        type: INTEGER
      - name: direction
        type: INTEGER
      - name: barGraphTopLeft
        type: Point
    dispatcher: ControlStripDispatch
    selector: 0x050C

- function:
    name: SBModalDialogInContext
    args:
      - name: filterProc
        type: ProcPtr
      - name: itemHit
        type: INTEGER*
    dispatcher: ControlStripDispatch
    selector: 0x040D

- function:
    name: SBGetControlStripFontID
    return: OSErr
    args:
      - name: fontID
        type: INTEGER*
    dispatcher: ControlStripDispatch
    selector: 0x020E

- function:
    name: SBSetControlStripFontID
    return: OSErr
    args:
      - name: fontID
        type: INTEGER
    dispatcher: ControlStripDispatch
    selector: 0x010F

- function:
    name: SBGetControlStripFontSize
    return: OSErr
    args:
      - name: fontSize
        type: INTEGER*
    dispatcher: ControlStripDispatch
    selector: 0x0210

- function:
    name: SBSetControlStripFontSize
    return: OSErr
    args:
      - name: fontSize
        type: INTEGER
    dispatcher: ControlStripDispatch
    selector: 0x0111

- function:
    name: SBGetShowHideHotKey
    return: OSErr
    args:
      - name: modifiers
        type: INTEGER*
      - name: keyCode
        type: uint8_t*
    dispatcher: ControlStripDispatch
    selector: 0x0412

- function:
    name: SBSetShowHideHotKey
    return: OSErr
    args:
      - name: modifiers
        type: INTEGER
      - name: keyCode
        type: uint8_t
    dispatcher: ControlStripDispatch
    selector: 0x0213

- function:
    name: SBIsShowHideHotKeyEnabled
    return: OSErr
    args:
      - name: enabled
        type: Boolean*
    dispatcher: ControlStripDispatch
    selector: 0x0214

- function:
    name: SBEnableShowHideHotKey
    return: OSErr
    args:
      - name: enabled
        type: Boolean
    dispatcher: ControlStripDispatch
    selector: 0x0115

- function:
    name: SBHitTrackSlider
    return: INTEGER
    args:
      - name: moduleRect
        type: Rect*
      - name: ticksOnSlider
        type: INTEGER
      - name: initialValue
        type: INTEGER
      - name: hit
        type: Boolean*
    dispatcher: ControlStripDispatch
    selector: 0x0616

# Icon Services' start-up and shut-down for 68k programs (Icons.h), and its
# switch for deep (colour) icons; IconServicesDispatch is iconservices.yaml's.
- function:
    name: IconServicesInit
    return: OSErr
    args:
      - name: initBlockPtr
        type: Ptr
    dispatcher: IconServicesDispatch
    selector: 0x0015

- function:
    name: IconServicesTerminate
    dispatcher: IconServicesDispatch
    selector: 0x0016

- function:
    name: GetDeepIconsEnabled
    return: OSErr
    args:
      - name: deepIconsEnabled
        type: Boolean*
    dispatcher: IconServicesDispatch
    selector: 0x002C

- function:
    name: SetDeepIconsEnabled
    return: OSErr
    args:
      - name: enableDeepIcons
        type: Boolean
    dispatcher: IconServicesDispatch
    selector: 0x002D
