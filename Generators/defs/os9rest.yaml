- function:
    name: UTResolveFCB
    return: OSErr
    args:
      - name: fileRefNum
        type: INTEGER
      - name: fileCtrlBlockPtr
        type: Ptr*
    dispatcher: HFSUtilDispatch
    selector: 0x0005

- function:
