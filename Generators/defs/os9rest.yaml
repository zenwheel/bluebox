    return: OSErr
    args:
      - name: entry
        type: RegEntryIDPtr
      - name: valuePtr
        type: uint16_t*
    dispatcher: ExpansionMgrDispatch
    selector: 0x0412

- function:
    name: ExpMgrInterruptAcknowledgeReadLong
    return: OSErr
    args:
      - name: entry
        type: RegEntryIDPtr
      - name: valuePtr
