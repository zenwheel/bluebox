# The Communications Toolbox's records (Connections.h, Terminals.h,
# FileTransfers.h): the Connection, Terminal and File Transfer Managers
# share their first fields (procID to oldConfig, and the private pointer
# at 40).  The routines go through _CommToolboxDispatch with the selector
# pushed last and A0 pointing at it; ctb.c has their table.

- struct:
    name: ConnRecord
    members:
      - name: procID
        type: INTEGER
      - name: flags
        type: LONGINT
      - name: errCode
        type: INTEGER
      - name: refCon
        type: LONGINT
      - name: userData
        type: LONGINT
      - name: defProc
        type: ProcPtr
      - name: config
        type: Ptr
      - name: oldConfig
        type: Ptr
      - name: asyncEOM
        type: LONGINT
      - name: reserved1
        type: LONGINT
      - name: reserved2
        type: LONGINT
      - name: cmPrivate
        type: Ptr
      - name: bufferArray
        type: Ptr[8]
      - name: bufSizes
        type: LONGINT[8]
      - name: mluField
        type: LONGINT
      - name: asyncCount
        type: LONGINT[8]
    size: 144

- struct:
    name: ConnEnvironRec
    members:
      - name: version
        type: INTEGER
      - name: baudRate
        type: LONGINT
      - name: dataBits
        type: INTEGER
      - name: channels
