# Routines the walk of the Vintage Apple Macintosh archive found missing.

# SndDispVersion(dSelector): the version of the tool SoundDispatch reaches
# with that selector in D0's low word (4 the MIDI Manager, 8 the Sound
# Manager, 12 the Speech Manager, 16 MACE, 20 the Sound Input Manager), 0
# for one that isn't there.  JUNO Librarian and Anthem ask it whether the
# MIDI Manager is installed (Anthem passes a word).
- function:
    name: FinaleUnknown1
    return: LONGINT
    args:
      - name: dSelector
        type: INTEGER
    dispatcher: SoundDispatch
    selector: 0x00000000
    variants: [SndDispVersion]

# The MIDI Manager's connection procedures: a port's, called as its
# connections change (Anthem sets one for each of its ports).
- function:
    name: MIDISetConnectionProc
    args:
      - name: refnum
        type: INTEGER
      - name: connectionProc
        type: Ptr
      - name: refCon
        type: LONGINT
    dispatcher: SoundDispatch
    selector: 0x00A80004

- function:
    name: MIDIGetConnectionProc
    args:
      - name: refnum
        type: INTEGER
      - name: connectionProc
        type: Ptr
      - name: refCon
        type: Ptr
    dispatcher: SoundDispatch
    selector: 0x00AC0004

- function:
    name: MIDIDiscardPacket
    args:
      - name: refnum
        type: INTEGER
      - name: packet
        type: Ptr
    dispatcher: SoundDispatch
    selector: 0x00B00004

# Window Manager layers (System 7's, for the Process Manager): private,
# PrivateInterfaceLib's to PowerPC programs and _LayerDispatch's to 68k
# ones.  Only the selectors programs were seen to use are given here:
# NewLayer is 1 (RegEdit's arguments), GetCurLayer 3 (Virtual's),
# SwapCurLayer 5 (RegEdit's, with the layer NewLayer made) and SetCurLayer
# 4 (RegEdit's, putting the old layer back after making its window in the
# new one; it leaves room for a word's result) and GetSubWindows 6
# (TarotWorks', with the layer GetCurLayer gave) and IsLayer 2 (HyperCard's
# window walk, in every program standalone from it).
- dispatcher:
    name: LayerDispatch
    trap: 0xA829
    selector-location: D0W

- function:
    name: NewLayer
    return: OSErr
    args:
      - name: layer
        type: WindowPtr*
      - name: visible
        type: Boolean
      - name: neverActive
        type: Boolean
      - name: behind
        type: WindowPtr
      - name: refCon
        type: LONGINT
    dispatcher: LayerDispatch
    selector: 0x0001

# Selector -1 is MoviePlay's, before it swaps in the layer it gave: with no
# arguments and a long result, taken as the program's own layer.
- function:
    name: GetAppLayer
    return: WindowPtr
    dispatcher: LayerDispatch
    selector: -1

- function:
    name: GetCurLayer
    return: WindowPtr
    dispatcher: LayerDispatch
    selector: 0x0003

- function:
    name: SetCurLayer
    return: OSErr
    args:
      - name: layer
        type: WindowPtr
    dispatcher: LayerDispatch
    selector: 0x0004

- function:
    name: SwapCurLayer
    return: WindowPtr
    args:
      - name: layer
        type: WindowPtr
    dispatcher: LayerDispatch
    selector: 0x0005

- function:
    name: GetSubWindows
    return: WindowPtr
    args:
      - name: layer
        type: WindowPtr
    dispatcher: LayerDispatch
    selector: 0x0006

- function:
    name: GetParent
    return: WindowPtr
    args:
      - name: window
        type: WindowPtr
    cfm: PrivateInterfaceLib

- function:
    name: IsLayer
    return: Boolean
    args:
      - name: window
        type: WindowPtr
    cfm: PrivateInterfaceLib
    dispatcher: LayerDispatch
    selector: 0x0002

# QDExtensions with older interfaces' selectors: 32-Bit QuickDraw's first
# headers loaded only the selector, MOVEQ #5,D0 for GetGWorld, without the
# parameter size in the high word (Drol, Bubblomania 1.0 to 1.2, Chips &
# DIPS).
- dispatcher:
    name: QDExtensions
    trap: 0xAB1D
    selector-location: D0<0xFFFF>

# The Display Manager's selectors, too, come with only the routine's number
# in D0 from some programs (King of Parking, Bugs Bannis, Rain'Net:
# MOVEQ #$36,D0 for DMNewDisplayModeList), without the parameter size byte.
- dispatcher:
    name: DisplayDispatch
    trap: 0xABEB
    selector-location: D0<0xFF>

# The Script Manager's TruncText and FindWordBreaks for 68k programs
# (Pentominoes, OpenMe First, YellowEdit Documentation); PowerPC ones had
# them already.
- function:
    name: TruncText
    return: INTEGER
    args:
      - name: width
        type: INTEGER
      - name: textPtr
        type: Ptr
      - name: length
        type: INTEGER*
      - name: truncWhere
        type: INTEGER
    dispatcher: ScriptUtil
    selector: 0x820CFFDE

- function:
    name: FindWordBreaks
    args:
      - name: textPtr
        type: Ptr
      - name: textLength
        type: INTEGER
      - name: offset
        type: INTEGER
      - name: leadingEdge
        type: Boolean
      - name: breaks
        type: Ptr
      - name: offsets
        type: Ptr
      - name: script
        type: INTEGER
    dispatcher: ScriptUtil
    selector: 0xC012001A

# GetFormatOrder for 68k programs (Eudora's text drawing); PowerPC ones had
# it already.  The argument list is the Script Manager's: the order's
# array, the first and last style runs, whether the line runs right, and
# the procedure that says which runs are right to left, with its argument.
- function:
    name: GetFormatOrder
    args:
      - name: ordering
        type: Ptr
      - name: firstFormat
        type: INTEGER
      - name: lastFormat
        type: INTEGER
      - name: lineRight
        type: Boolean
      - name: rlDirProc
        type: ProcPtr
      - name: dirParam
        type: Ptr
    dispatcher: ScriptUtil
    selector: 0x8012FFFC

# The Control Strip (_ControlStripDispatch, ControlStripLib): its state
# (Kinga and Tracktor Beam hide it while they run).  The selector is D0's
# low byte, the high byte the arguments' size in words.
- dispatcher:
    name: ControlStripDispatch
    trap: 0xAAF2
    selector-location: D0<0xFF>

- function:
    name: SBIsControlStripVisible
    return: Boolean
    dispatcher: ControlStripDispatch
    selector: 0x0000

- function:
    name: SBShowHideControlStrip
    args:
      - name: showIt
        type: Boolean
    dispatcher: ControlStripDispatch
    selector: 0x0101

- function:
    name: SBSafeToAccessStartupDisk
    return: Boolean
    dispatcher: ControlStripDispatch
    selector: 0x0002

# A module's resource file, preferences and detached strings (the
# registration programs of CalcStrip, G3Strip and G3Throttle, and OT:PPP's
# CSM helper, load their preferences at start); see controlstrip.c.
- function:
    name: SBOpenModuleResourceFile
    return: INTEGER
    args:
      - name: fileCreator
        type: OSType
    dispatcher: ControlStripDispatch
    selector: 0x0203

- function:
    name: SBLoadPreferences
    return: OSErr
    args:
      - name: prefsResourceName
        type: ConstStr255Param
      - name: preferences
        type: Handle*
    dispatcher: ControlStripDispatch
    selector: 0x0404

- function:
    name: SBSavePreferences
    return: OSErr
    args:
      - name: prefsResourceName
        type: ConstStr255Param
      - name: preferences
        type: Handle
    dispatcher: ControlStripDispatch
    selector: 0x0405

- function:
    name: SBGetDetachedIndString
    args:
      - name: theString
        type: StringPtr
      - name: stringList
        type: Handle
      - name: whichString
        type: INTEGER
    dispatcher: ControlStripDispatch
    selector: 0x0506
