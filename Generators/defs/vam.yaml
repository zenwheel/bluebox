# Routines the walk of the Vintage Apple Macintosh archive found missing.

# SndDispVersion(dSelector): the version of the tool SoundDispatch reaches
# with that selector in D0's low word (4 the MIDI Manager, 8 the Sound
# Manager, 12 the Speech Manager, 16 MACE, 20 the Sound Input Manager), 0
# for one that isn't there.  JUNO Librarian and Anthem ask it whether the
# MIDI Manager is installed (Anthem passes a word).
- function:
    name: FinaleUnknown1
    return: LONGINT
    args:
      - name: dSelector
        type: INTEGER
    dispatcher: SoundDispatch
    selector: 0x00000000
    variants: [SndDispVersion]

# The MIDI Manager's connection procedures: a port's, called as its
# connections change (Anthem sets one for each of its ports).
- function:
    name: MIDISetConnectionProc
    args:
      - name: refnum
        type: INTEGER
      - name: connectionProc
        type: Ptr
      - name: refCon
        type: LONGINT
    dispatcher: SoundDispatch
    selector: 0x00A80004

- function:
    name: MIDIGetConnectionProc
    args:
      - name: refnum
        type: INTEGER
      - name: connectionProc
        type: Ptr
      - name: refCon
        type: Ptr
    dispatcher: SoundDispatch
    selector: 0x00AC0004

- function:
    name: MIDIDiscardPacket
    args:
      - name: refnum
        type: INTEGER
      - name: packet
        type: Ptr
    dispatcher: SoundDispatch
    selector: 0x00B00004
