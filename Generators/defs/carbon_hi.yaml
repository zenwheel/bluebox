# CarbonLib's drawing, windows and menus (carbon_qd.c, carbon_wm.c,
# carbon_menu.c, carbon_ui.c; the rest of their exports are written by
# hand there).  These are the ones that have a 68k trap too.

# StdOpcode (Quickdraw.h): the bottleneck for picture opcodes QuickDraw
# doesn't know, _StdOpcodeProc.
- function:
    name: StdOpcode
    args:
      - name: fromRect
        type: Rect*
      - name: toRect
        type: Rect*
      - name: opcode
        type: uint16_t
      - name: version
        type: int16_t
    trap: 0xABF8

# HiliteWindowFrameForDrag (MacWindows.h): for 68k code, MOVEQ #$19,D0 then
# $A829, Mac OS 8.5's Window Manager dispatch.  Not installed: the System
# Blue Box reports (7.1, 8.1 for PowerPC) had no $A829, and programs that
# find it implemented call it with Mac OS 8.5's other selectors (SpookHouse
# and StarGuardian, HyperCard standalones; SoundEdit Pro; MoviePlay).
- function:
    name: HiliteWindowFrameForDrag
    return: OSStatus
    args:
      - name: window
        type: WindowPtr
      - name: hilited
        type: Boolean
    cfm: CarbonLib
