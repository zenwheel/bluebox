# The old hardware and networking managers (Power.h, Start.h, SCSI.h,
# Slots.h, DatabaseAccess.h, AppleTalk.h, ENET.h, PPCToolbox.h, Devices.h,
# DiskInit.h, FileMapping.h ...): InterfaceLib's calls, and the 68k traps
# and selectors Apple gave them.  Same schema as Defs/multiversal/defs.

# ---- The Power Manager (power.c) ----

# _PowerDispatch ($A09E): MOVEQ #selector,D0; the answer in D0.
- dispatcher:
    name: PowerDispatch
    trap: 0xA09E
    selector-location: D0W

- function:
    name: PMSelectorCount
    return: INTEGER
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x0000

- function:
    name: PMFeatures
    return: uint32_t
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x0001

- function:
    name: GetSleepTimeout
    return: uint8_t
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x0002

- function:
    name: BatteryCount
    return: INTEGER
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x001A

- function:
    name: GetDimmingTimeout
    return: uint8_t
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x001D

# The PMgrOp family ($A085 and its flag variants) is a portable's; on the
# desktop Blue Box presents these are InterfaceLib's alone.
- function:
    name: BatteryStatus
    return: OSErr
    args:
      - name: status
        type: Ptr
      - name: power
        type: Ptr
    cfm: InterfaceLib

- function:
    name: ModemStatus
    return: OSErr
    args:
      - name: status
        type: Ptr
    cfm: InterfaceLib

- function:
    name: GetWUTime
    return: OSErr
    args:
      - name: wuTime
        type: Ptr
      - name: wuFlag
        type: Ptr
    cfm: InterfaceLib

- function:
    name: SetWUTime
    return: OSErr
    args:
      - name: wuTime
        type: LONGINT
    cfm: InterfaceLib

- function:
    name: DisableWUTime
    return: OSErr
    cfm: InterfaceLib

- function:
    name: AOn
    cfm: InterfaceLib

- function:
    name: AOnIgnoreModem
    cfm: InterfaceLib

- function:
    name: BOn
    cfm: InterfaceLib

- function:
    name: AOff
    cfm: InterfaceLib

- function:
    name: BOff
    cfm: InterfaceLib

- function:
    name: GetCPUSpeed
    return: LONGINT
    cfm: InterfaceLib

# ---- The Start Manager (power.c): A0 the record ----

- function:
    name: GetDefaultStartup
    args:
      - name: paramBlock
        type: Ptr
        register: A0
    trap: 0xA07D

- function:
    name: SetDefaultStartup
    args:
      - name: paramBlock
        type: Ptr
        register: A0
    trap: 0xA07E

- function:
    name: SetVideoDefault
    args:
      - name: paramBlock
        type: Ptr
        register: A0
    trap: 0xA081

- function:
    name: SetOSDefault
    args:
      - name: paramBlock
        type: Ptr
        register: A0
    trap: 0xA083

- function:
    name: GetOSDefault
    args:
      - name: paramBlock
        type: Ptr
        register: A0
    trap: 0xA084

- function:
    name: GetTimeout
    args:
      - name: count
        type: Ptr
    cfm: InterfaceLib

- function:
    name: SetTimeout
    args:
      - name: count
        type: INTEGER
    cfm: InterfaceLib

# ---- The SCSI Manager (scsi.c) ----

# _SCSIDispatch ($A815): Pascal arguments, then MOVE.W #selector,-(SP).
- dispatcher:
    name: SCSIDispatch
    trap: 0xA815
    selector-location: StackW

- function:
    name: SCSIReset
    return: OSErr
    dispatcher: SCSIDispatch
    selector: 0x0000

- function:
    name: SCSIGet
    return: OSErr
    dispatcher: SCSIDispatch
    selector: 0x0001

- function:
    name: SCSISelect
    return: OSErr
    args:
      - name: targetID
        type: INTEGER
    dispatcher: SCSIDispatch
    selector: 0x0002

- function:
    name: SCSICmd
    return: OSErr
    args:
      - name: buffer
        type: Ptr
      - name: count
        type: INTEGER
    dispatcher: SCSIDispatch
    selector: 0x0003

- function:
    name: SCSIComplete
    return: OSErr
    args:
      - name: stat
        type: Ptr
      - name: message
        type: Ptr
      - name: wait
        type: uint32_t
    dispatcher: SCSIDispatch
    selector: 0x0004

- function:
    name: SCSIRead
    return: OSErr
    args:
      - name: tibPtr
        type: Ptr
    dispatcher: SCSIDispatch
    selector: 0x0005

- function:
    name: SCSIWrite
    return: OSErr
    args:
      - name: tibPtr
        type: Ptr
    dispatcher: SCSIDispatch
    selector: 0x0006

- function:
    name: SCSIRBlind
    return: OSErr
    args:
      - name: tibPtr
        type: Ptr
    dispatcher: SCSIDispatch
    selector: 0x0008

- function:
    name: SCSIWBlind
    return: OSErr
    args:
      - name: tibPtr
        type: Ptr
    dispatcher: SCSIDispatch
    selector: 0x0009

- function:
    name: SCSIStat
    return: INTEGER
    dispatcher: SCSIDispatch
    selector: 0x000A

- function:
    name: SCSISelAtn
    return: OSErr
    args:
      - name: targetID
        type: INTEGER
    dispatcher: SCSIDispatch
    selector: 0x000B

- function:
    name: SCSIMsgIn
    return: OSErr
    args:
      - name: message
        type: Ptr
    dispatcher: SCSIDispatch
    selector: 0x000C

- function:
    name: SCSIMsgOut
    return: OSErr
    args:
      - name: message
        type: INTEGER
    dispatcher: SCSIDispatch
    selector: 0x000D

# SCSI Manager 4.3's _SCSIAtomic ($A089): MOVEQ #selector,D0, A0 the
# parameter block, the result in D0.
- dispatcher:
    name: SCSIAtomic
    trap: 0xA089
    selector-location: D0W

- function:
    name: SCSIAction
    return: OSErr
    args:
      - name: parameterBlock
        type: Ptr
        register: A0
    returnreg: D0
    dispatcher: SCSIAtomic
    selector: 0x0001

- function:
    name: SCSIRegisterBus
    return: OSErr
    args:
      - name: parameterBlock
        type: Ptr
        register: A0
    returnreg: D0
    dispatcher: SCSIAtomic
    selector: 0x0002

- function:
    name: SCSIDeregisterBus
    return: OSErr
    args:
      - name: parameterBlock
        type: Ptr
        register: A0
    returnreg: D0
    dispatcher: SCSIAtomic
    selector: 0x0003

- function:
    name: SCSIReregisterBus
    return: OSErr
    args:
      - name: parameterBlock
        type: Ptr
        register: A0
    returnreg: D0
    dispatcher: SCSIAtomic
    selector: 0x0004

- function:
    name: SCSIKillXPT
    return: OSErr
    args:
      - name: parameterBlock
        type: Ptr
        register: A0
    returnreg: D0
    dispatcher: SCSIAtomic
    selector: 0x0005

# The ATA Manager: a G3's, for PowerPC programs ($AAF1 stays the Quadra
# 800's unimplemented trap).
- function:
    name: ataManager
    return: INTEGER
    args:
      - name: pb
        type: Ptr
    cfm: InterfaceLib

# ---- The Slot Manager (slots.c): _SlotManager ($A06E) is a raw trap,
# the selector in D0 and the SpBlock in A0; these are its InterfaceLib
# calls, and the slot interrupt queue's traps. ----

