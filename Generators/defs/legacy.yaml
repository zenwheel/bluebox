# ---- The Data Access Manager (dbaccess.c): _Pack13 ($A82F), Pascal
# arguments, MOVE.W #selector,D0 (the arguments' size in words in its
# high byte). ----
- dispatcher:
    name: Pack13
    trap: 0xA82F
    selector-location: D0W

- function:
    name: InitDBPack
    return: OSErr
    args:
      - name: version
        type: INTEGER
    dispatcher: Pack13
    selector: 0x0100

- function:
    name: DBInit
    return: OSErr
