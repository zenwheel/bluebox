      - name: sessID
        type: Ptr
      - name: ddevName
        type: Ptr
      - name: host
        type: Ptr
      - name: user
        type: Ptr
      - name: passwd
        type: Ptr
      - name: connStr
        type: Ptr
      - name: asyncPB
        type: Ptr
    dispatcher: Pack13
    selector: 0x0E02

- function:
    name: DBEnd
    return: OSErr
    args:
      - name: sessID
        type: LONGINT
      - name: asyncPB
        type: Ptr
    dispatcher: Pack13
    selector: 0x0403

