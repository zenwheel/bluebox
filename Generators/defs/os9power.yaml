# The Power Manager's remaining _PowerDispatch selectors (Power.h), for
# PowerMgrLib and 68k programs: power.c's desktop with nothing to power
# manage, and os9svc_power.c's settings and activity times.

- function:
    name: SetSleepTimeout
    args:
      - name: timeout
        type: uint8_t
        register: D0HighWord
    dispatcher: PowerDispatch
    selector: 0x0003

- function:
    name: GetHardDiskTimeout
    return: uint8_t
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x0004

- function:
    name: SetHardDiskTimeout
    args:
      - name: timeout
        type: uint8_t
        register: D0HighWord
    dispatcher: PowerDispatch
    selector: 0x0005

- function:
    name: HardDiskPowered
    return: Boolean
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x0006

- function:
    name: SpinDownHardDisk
    dispatcher: PowerDispatch
    selector: 0x0007

- function:
    name: IsSpindownDisabled
    return: Boolean
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x0008

- function:
    name: SetSpindownDisable
    args:
      - name: setDisable
        type: Boolean
        register: D0HighWord
    dispatcher: PowerDispatch
    selector: 0x0009

- function:
    name: HardDiskQInstall
    return: OSErr
    args:
      - name: theElement
        type: Ptr
        register: A0
    returnreg: D0
    dispatcher: PowerDispatch
    selector: 0x000A

- function:
