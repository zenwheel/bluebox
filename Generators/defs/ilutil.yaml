# InterfaceLib's utility calls (M17) that multiversal lacks: the debugger
# utility trap, the Dictionary Manager, AVL trees, the Text Services
# Manager and the rest.  Same schema as Defs/multiversal/defs.  Written
# from the published interfaces' trap words and selectors.

# _DebugUtil ($A08D), selector in D0 (MOVEQ #n,D0), arguments in A0/A1.
- dispatcher:
    name: DebugUtil
    trap: 0xA08D
    selector-location: D0W

- function:
    name: DebuggerGetMax
    return: int32_t
    returnreg: D0
    dispatcher: DebugUtil
    selector: 0x0000

- function:
    name: DebuggerEnter
    dispatcher: DebugUtil
    selector: 0x0001

- function:
    name: DebuggerExit
    dispatcher: DebugUtil
    selector: 0x0002

- function:
    name: DebuggerPoll
    dispatcher: DebugUtil
    selector: 0x0003

- function:
    name: GetPageState
    return: int16_t
    args:
      - name: address
        type: void*
        register: A0
    returnreg: D0
    dispatcher: DebugUtil
    selector: 0x0004

- function:
    name: PageFaultFatal
    return: Boolean
    returnreg: D0
    dispatcher: DebugUtil
    selector: 0x0005

- function:
    name: DebuggerLockMemory
    return: OSErr
    args:
      - name: address
        type: void*
        register: A0
      - name: count
        type: uint32_t
        register: A1
    returnreg: D0
    dispatcher: DebugUtil
    selector: 0x0006

- function:
    name: DebuggerUnlockMemory
    return: OSErr
    args:
      - name: address
        type: void*
        register: A0
      - name: count
        type: uint32_t
        register: A1
    returnreg: D0
    dispatcher: DebugUtil
    selector: 0x0007

- function:
    name: EnterSupervisorMode
    return: int16_t
    returnreg: D0
    dispatcher: DebugUtil
    selector: 0x0008

# The Dictionary Manager: _DictionaryDispatch ($AA53), the selector in D0
# (the parameters' size in words in its high byte), Pascal arguments.
- dispatcher:
    name: DictionaryDispatch
    trap: 0xAA53
    selector-location: D0W

- function:
    name: InitializeDictionary
    return: OSErr
    args:
      - name: spec
        type: FSSpec*
      - name: maximumKeyLength
        type: int16_t
      - name: keyAttributes
        type: int8_t
      - name: script
        type: int16_t
    dispatcher: DictionaryDispatch
    selector: 0x0500

- function:
    name: OpenDictionary
    return: OSErr
    args:
      - name: spec
        type: FSSpec*
      - name: accessPermission
        type: int8_t
      - name: dictionaryReference
        type: int32_t*
    dispatcher: DictionaryDispatch
    selector: 0x0501

- function:
    name: CloseDictionary
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
    dispatcher: DictionaryDispatch
    selector: 0x0202

- function:
    name: InsertRecordToDictionary
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
      - name: key
        type: ConstStr255Param
      - name: recordDataHandle
        type: Handle
      - name: whichMode
        type: int16_t
    dispatcher: DictionaryDispatch
    selector: 0x0703

- function:
    name: DeleteRecordFromDictionary
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
      - name: key
        type: ConstStr255Param
    dispatcher: DictionaryDispatch
    selector: 0x0404

- function:
    name: FindRecordInDictionary
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
      - name: key
        type: ConstStr255Param
      - name: requestedAttributeTablePointer
        type: void*
      - name: recordDataHandle
        type: Handle
    dispatcher: DictionaryDispatch
    selector: 0x0805

- function:
    name: FindRecordByIndexInDictionary
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
      - name: recordIndex
        type: int32_t
      - name: requestedAttributeTablePointer
        type: void*
      - name: recordKey
        type: StringPtr
      - name: recordDataHandle
        type: Handle
    dispatcher: DictionaryDispatch
    selector: 0x0A06

- function:
    name: GetDictionaryInformation
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
      - name: theDictionaryInformation
        type: void*
    dispatcher: DictionaryDispatch
    selector: 0x0407

- function:
    name: CompactDictionary
    return: OSErr
    args:
      - name: dictionaryReference
        type: int32_t
    dispatcher: DictionaryDispatch
    selector: 0x0208

# AVL trees (AVLTree.h): _AVLTreeDispatch ($AA80), the selector in D0 as
# the Dictionary Manager's, Pascal arguments.
- dispatcher:
    name: AVLTreeDispatch
    trap: 0xAA80
    selector-location: D0W

- function:
    name: AVLInit
    return: OSErr
    args:
      - name: flags
        type: uint32_t
      - name: compareItemsProc
        type: ProcPtr
      - name: sizeItemProc
        type: ProcPtr
      - name: disposeItemProc
        type: ProcPtr
      - name: refCon
        type: void*
      - name: tree
        type: void*
    dispatcher: AVLTreeDispatch
    selector: 0x0C01

- function:
    name: AVLDispose
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: order
        type: uint16_t
    dispatcher: AVLTreeDispatch
    selector: 0x0302

- function:
    name: AVLWalk
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: walkProc
        type: ProcPtr
      - name: order
        type: uint16_t
      - name: walkRefCon
        type: void*
    dispatcher: AVLTreeDispatch
    selector: 0x0703

- function:
    name: AVLCount
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: count
        type: uint32_t*
    dispatcher: AVLTreeDispatch
    selector: 0x0804

- function:
    name: AVLGetIndItem
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: index
        type: uint32_t
      - name: dataPtr
        type: void*
      - name: itemSize
        type: uint32_t*
    dispatcher: AVLTreeDispatch
    selector: 0x0805

- function:
    name: AVLInsert
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: data
        type: void*
    dispatcher: AVLTreeDispatch
    selector: 0x0406

- function:
    name: AVLRemove
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: key
        type: void*
      - name: dataPtr
        type: void*
      - name: itemSize
        type: uint32_t*
    dispatcher: AVLTreeDispatch
    selector: 0x0807

- function:
    name: AVLFind
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: key
        type: void*
      - name: dataPtr
        type: void*
      - name: itemSize
        type: uint32_t*
    dispatcher: AVLTreeDispatch
    selector: 0x0808

- function:
    name: AVLGetRefcon
    return: OSErr
    args:
      - name: tree
        type: void*
      - name: refCon
        type: void*
    dispatcher: AVLTreeDispatch
    selector: 0x0409

# The Text Services Manager: _TSMDispatch ($AA54), the selector in D0
# (MOVEQ #n,D0), Pascal arguments.
- dispatcher:
    name: TSMDispatch
    trap: 0xAA54
    selector-location: D0W

- function:
    name: NewTSMDocument
    return: OSErr
    args:
      - name: numOfInterface
        type: int16_t
      - name: supportedInterfaceTypes
        type: OSType*
      - name: idocID
        type: void*
      - name: refcon
        type: int32_t
    dispatcher: TSMDispatch
    selector: 0x0000

- function:
    name: DeleteTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: void*
    dispatcher: TSMDispatch
    selector: 0x0001

- function:
    name: ActivateTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: void*
    dispatcher: TSMDispatch
    selector: 0x0002

- function:
    name: DeactivateTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: void*
    dispatcher: TSMDispatch
    selector: 0x0003

- function:
    name: TSMEvent
    return: Boolean
    args:
      - name: event
        type: EventRecord*
    dispatcher: TSMDispatch
    selector: 0x0004

- function:
    name: TSMMenuSelect
    return: Boolean
    args:
      - name: menuResult
        type: int32_t
    dispatcher: TSMDispatch
    selector: 0x0005

- function:
    name: SetTSMCursor
    return: Boolean
    args:
      - name: mousePos
        type: Point
    dispatcher: TSMDispatch
    selector: 0x0006

- function:
    name: FixTSMDocument
    return: OSErr
    args:
      - name: idocID
        type: void*
    dispatcher: TSMDispatch
    selector: 0x0007

- function:
    name: GetServiceList
    return: OSErr
    args:
      - name: numOfInterface
        type: int16_t
      - name: supportedInterfaceTypes
        type: OSType*
      - name: serviceInfo
        type: Handle*
      - name: seedValue
        type: int32_t*
    dispatcher: TSMDispatch
    selector: 0x0008

- function:
    name: OpenTextService
    return: OSErr
    args:
      - name: idocID
        type: void*
      - name: aComponent
        type: uint32_t
      - name: aComponentInstance
        type: uint32_t*
    dispatcher: TSMDispatch
    selector: 0x0009

- function:
    name: CloseTextService
    return: OSErr
    args:
      - name: idocID
        type: void*
      - name: aComponentInstance
        type: uint32_t
    dispatcher: TSMDispatch
    selector: 0x000A

- function:
    name: SendAEFromTSMComponent
    return: OSErr
    args:
      - name: theAppleEvent
        type: AEDesc*
      - name: reply
        type: AEDesc*
      - name: sendMode
        type: int32_t
      - name: sendPriority
        type: int16_t
      - name: timeOutInTicks
        type: int32_t
      - name: idleProc
        type: ProcPtr
      - name: filterProc
        type: ProcPtr
    dispatcher: TSMDispatch
    selector: 0x000B

- function:
    name: SetDefaultInputMethod
    return: OSErr
    args:
      - name: ts
        type: uint32_t
      - name: slRecordPtr
        type: void*
    dispatcher: TSMDispatch
    selector: 0x000C

- function:
    name: GetDefaultInputMethod
    return: OSErr
    args:
      - name: ts
        type: uint32_t*
      - name: slRecordPtr
        type: void*
    dispatcher: TSMDispatch
    selector: 0x000D

- function:
    name: SetTextServiceLanguage
    return: OSErr
    args:
      - name: slRecordPtr
        type: void*
    dispatcher: TSMDispatch
    selector: 0x000E

- function:
    name: GetTextServiceLanguage
    return: OSErr
    args:
      - name: slRecordPtr
        type: void*
    dispatcher: TSMDispatch
    selector: 0x000F

- function:
    name: UseInputWindow
    return: OSErr
    args:
      - name: idocID
        type: void*
      - name: useWindow
        type: Boolean
    dispatcher: TSMDispatch
    selector: 0x0010

- function:
    name: NewServiceWindow
    return: OSErr
    args:
      - name: wStorage
        type: void*
      - name: boundsRect
        type: Rect*
      - name: title
        type: ConstStr255Param
      - name: visible
        type: Boolean
      - name: theProc
        type: int16_t
      - name: behind
        type: WindowPtr
      - name: goAwayFlag
        type: Boolean
      - name: ts
        type: uint32_t
      - name: window
        type: WindowPtr*
    dispatcher: TSMDispatch
    selector: 0x0011

- function:
    name: CloseServiceWindow
    return: OSErr
    args:
      - name: window
        type: WindowPtr
    dispatcher: TSMDispatch
    selector: 0x0012

- function:
    name: GetFrontServiceWindow
    return: OSErr
    args:
      - name: window
        type: WindowPtr*
    dispatcher: TSMDispatch
    selector: 0x0013

- function:
    name: InitTSMAwareApplication
    return: OSErr
    dispatcher: TSMDispatch
    selector: 0x0014

- function:
    name: CloseTSMAwareApplication
    return: OSErr
    dispatcher: TSMDispatch
    selector: 0x0015

- function:
    name: FindServiceWindow
    return: int16_t
    args:
      - name: thePoint
        type: Point
      - name: theWindow
        type: WindowPtr*
    dispatcher: TSMDispatch
    selector: 0x0017

- function:
    name: NewCServiceWindow
    return: OSErr
    args:
      - name: wStorage
        type: void*
      - name: boundsRect
        type: Rect*
      - name: title
        type: ConstStr255Param
      - name: visible
        type: Boolean
      - name: theProc
        type: int16_t
      - name: behind
        type: WindowPtr
      - name: goAwayFlag
        type: Boolean
      - name: ts
        type: uint32_t
      - name: window
        type: WindowPtr*
    dispatcher: TSMDispatch
    selector: 0x001A
